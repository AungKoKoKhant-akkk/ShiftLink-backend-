spring.application.name=shiftlink

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shiftlink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shiftlink}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shiftlink_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true